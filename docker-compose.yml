version: '3'

services:
  
  auth:
    build:
      context: ./auth_api
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=content
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=16be489f7ba8a18ab6d506a207dde676a56bc7684b1a16120d4d432b19f3a8cd
      - JWT_SECRET_KEY=16be489f7ba8a18ab6d506a207dde676a56bc7684b1a16120d4d432b19f3a8cd
      - JWT_ACCESS_TOKEN_EXPIRES_HOURS=1
      - JWT_REFRESH_TOKEN_EXPIRES_DAYS=30
  
  db:
    image: postgres:13.0-alpine
    restart: always
    volumes:
      - .db/data:/var/lib/postgresql/data 
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=content

  redis:
    image: redis:6.0
    ports:
      - 6379:6379
