openapi: 3.0.3

info:
  title: Role API
  version: '1.0'
  description: API for add, edit and remove roles for users

paths:
  /roles:
    get:
      tags: [Roles]

      security:
        - AccessToken: []

      operationId: app.get_roles
      summary: Get all roles

      responses:
        200:
          description: Return roles
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Role'
        401:
          description: Wrong token

  /role/{role_id}:
    get:
      tags: [Roles]

      security:
        - AccessToken: []

      operationId: app.get_role
      summary: Get a single role

      parameters:
        - $ref: '#/components/parameters/RoleId'

      responses:
        200:
          description: Return role
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/Role'
        401:
          description: Wrong token
        404:
          description: Role does not exis

    put:
      tags: [Roles]

      security:
        - AccessToken: []

      operationId: app.put_role
      summary: Create or update a role
  
      parameters:
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/Description'
        - $ref: '#/components/parameters/Rule'

      responses:
        200:
          description: Role updated
        201:
          description: New role created
        401:
          description: Unauthorized request

    delete:
      tags: [Roles]

      security:
        - AccessToken: []

      operationId: app.delete_role
      summary: Remove a role

      parameters:
        - $ref: '#/components/parameters/RoleId'

      responses:
        204:
          description: Role was deleted
        404:
          description: Role does not exist
        401:
          description: Unauthorized request
  
  /check:
    get:
      tags: [Check]

      security:
        - AccessToken: []

      operationId: app.check_role
      summary: Check that user has role

      parameters:
        - $ref: '#/components/parameters/UserIdQ'
        - $ref: '#/components/parameters/RoleIdQ'

      responses:
        200:
          description: User has role
        404:
          description: User doen't have role
        401:
          description: Unauthorized request 
  
  /check/{user_id}/{role_id}:
    get:
      tags: [Check]
      
      security:
        - AccessToken: []
      
      operationId: app.check_user_and_role
      summary: Check that user has role
      
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleId'
      
      responses:
        200:
          description: User has role
        404:
          description: User doen't have role
        401:
          description: Unauthorized request

components:
  schemas:
    Role:
      type: object
      required:
        - role
        - description
        - rule
      properties:
        id:
          type: string
          description: Unique identifier
          example: "123"
          readOnly: true
        role:
          type: string
          description: role's name
          example: "subscriber"
          minLength: 1
          maxLength: 100
        description:
          type: string
          description: Role description
          example: "Simple subscriber"
        rule:
          type: string
          description: "publication_data>1990"
        created:
          type: string
          format: date-time
          description: Creation time
          example: "2015-07-07T15:49:51.230+02:00"
          readOnly: true

  parameters:
    RoleId:
      name: role_id
      description: Role's Unique identifier
      in: path
      schema: 
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
        example: "123"
      required: true

    RoleIdQ:
      name: role_id
      description: Role's Unique identifier
      in: query
      schema: 
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
        example: "123"
      required: true

    UserId:
      name: user_id
      description: User's Unique identifier
      in: path
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
      required: true

    UserIdQ:
      name: user_id
      description: User's Unique identifier
      in: query
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
      required: true

    Role:
      name: role
      description: Role's name
      in: query
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
        example: "subscriber"

    Description:  
      name: description
      description: Role's description
      in: query
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
        example: "Simple subscriber"
      required: true

    Rule:
      name: rule
      description: Role's rule
      in: query
      schema:
        type: string
        example: "publication_data>1990"

  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT