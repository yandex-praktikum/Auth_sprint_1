swagger: '2.0'

info:
  title: Auth API
  version: "0.1"
  description: API for signup, login and auth users
paths:
  /login:
    post:
      operationId: auth.login_post
      summary: take login, password return access and refresh token
      parameters:
        - $ref: '#/parameters/login'
        - $ref: '#/parameters/password'
      responses:
        200:
          description: Return tokens
          schema:
            type: object
            properties:
              access_token:
                type: string
              refresh_token:
                type: string
        400: 
          description: Login does not exist
        401:
          description: Wrong password
  /signup:
    post:
      operationId: auth.signup_post
      summary: create new user
      parameters:
        - $ref: '#/parameters/login'
        - $ref: '#/parameters/email'
        - $ref: '#/parameters/name'
        - $ref: '#/parameters/password'
      responses:
        201:
          description: Successful registration
        409: 
          description: Login or E-mail already exists
  /refresh:
    post:
      operationId: auth.refresh_post
      summary: check refresh tocken from header, give new access and refresh token
      responses:
        200:
          description: Return tokens
          schema:
            type: object
            properties:
              access_token:
                type: string
              refresh_token:
                type: string
        401:
          description: Wrong token
  /info:
    get:
      operationId: auth.info_get
      summary: information about auth jwt is nedded
      responses:
        200:
          description: auth records
  /logout:
    delete:
      operationId: auth.logout
      summary: clean tokens
      responses:
        200:
          description: Access and refresh token delete
  /newlogin:
    post:
      operationId: auth.newlogin_post
      summary: chenge login
      parameters:
        - $ref: '#/parameters/login'
        - $ref: '#/parameters/new_login'
        - $ref: '#/parameters/password'
      responses:
        200:
          description: New login set
        409: 
          description: New login already exists
        404:
          description: Login dose not exist
        401:
          description: Wrong password
  /newpassword:
    post:
      operationId: auth.newpasswor_post
      summary: chenge password
        - $ref: '#/parameters/login'
        - $ref: '#/parameters/new_password'
        - $ref: '#/parameters/password'
      responses:
        200:
          description: New password set
        404:
          description: Login dose not exist
        401:
          description: Wrong password
parameters:
  login:
    name: login
    description: user login
    in: path
    type: string
    required: true
    pattern: "^[a-zA-Z0-9-]+$"
  password:
    name: password
    description: user pasword
    in: path
    type: string
    required: true
    pattern: "^[a-zA-Z0-9-]+$"
  email:
    name: email
    description: user email
    in: path
    type: string
    required: true
    pattern: "^[a-zA-Z0-9-]+$"
  name:
    name: name
    description: user name
    in: path
    type: string
    required: true
    pattern: "^[a-zA-Z0-9-]+$"
  new_login:
    name: new_login
    description: new user login
    in: path
    type: string
    required: true
    pattern: "^[a-zA-Z0-9-]+$"
  new_password:
    name: new_password
    description: new user pasword
    in: path
    type: string
    required: true
    pattern: "^[a-zA-Z0-9-]+$" 
