openapi: 3.0.3

info:
  title: Auth API
  version: '1.0'
  description: API for signup, login and auth users

servers:
  - url: http://localhost:5001/api/v1/

paths:

  /signup:
    post:
      tags: [SignUp]

      operationId: auth.signup_post
      summary: Create a new user

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'

      responses:
        201:
          description: Successful registration
        409:
          description: Login or E-mail already exists

  /login:
    post:
      tags: [Login]

      operationId: auth.login_post
      summary: Return the access and refresh tokens

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'

      responses:
        200:
          description: Succesuful returned tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        401:
          description: A wrong Login or Password

  /login/{page}:
    get:
      tags: [Login]

      security:
        - AccessToken: []

      operationId: auth.info_get
      summary: Information about auth jwt is needed

      parameters:
        - in: path
          name: page
          required: true
          schema:
            type: integer
          description: Page for pagination

      responses:
        200:
          description: Auth records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRecords'
        401:
          description: Wrong token

  /refresh:
    post:
      tags: [Login]
      security:
        - RefreshToken: []

      operationId: auth.refresh_post
      summary: Check the refresh token from header, give new access and refresh token

      responses:
        200:
          description: Return tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        401:
          description: Wrong token

  /logout:
    delete:
      tags: [Login]
      security:
        - AccessToken: []

      operationId: auth.logout
      summary: Clean tokens

      responses:
        200:
          description: Access and refresh token delete
        401:
          description: Wrong token

  /newlogin:
    put:
      tags: [Chenge]

      operationId: auth.newlogin_post
      summary: Change login

      parameters:
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/NewLogin'
        - $ref: '#/components/parameters/Password'

      responses:
        200:
          description: New login set
        404:
          description: Login dose not exist
        401:
          description: Wrong password

  /user:
    put:
      tags: [Chenge]

      operationId: auth.newpasswor_post
      summary: Change password

      parameters:
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/NewPassword'
        - $ref: '#/components/parameters/Password'

      responses:
        200:
          description: New password set
        409:
          description: New login already exists
        404:
          description: Login dose not exist
        401:
          description: Wrong password

components:
  schemas:
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AuthRecords:
      type: array
      items:
        type: object
        properties:
          date_time:
            type: string
            format: date-time
            description: Event time
            example: "2015-07-07T15:49:51.230+02:00"
          user_agent:
            type: string
            description: User agent
            example: "Chrome"


    Login:
      type: object
      properties:
        login:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
        password:
          type: string

    Signup:
      type: object
      properties:
        login:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
        email:
          type: string
        name:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
        password:
          type: string

    NewLogin:
      type: object
      properties:
        login:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
        new_login:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
        password:
          type: string


  parameters:
    Login:
      name: login
      description: User login
      in: query
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
      required: true

    Name:
      name: name
      description: User name
      in: query
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
      required: true

    Password:
      name: password
      description: User password
      in: query
      schema:
        type: string
      required: true

    Email:
      name: email
      description: User email
      in: query
      schema:
        type: string
      required: true

    NewLogin:
      name: new_login
      description: New user login
      in: query
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-]+$"
      required: true

    NewPassword:
      name: new_password
      description: New user password
      in: query
      schema:
        type: string
      required: true

  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

    RefreshToken:
      type: http
      scheme: bearer
      bearerFormat: JWT